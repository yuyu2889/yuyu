<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="高校实验室设备预约管理系统" />
    <title>实验室设备预约系统</title>
    <style>
      /* 首屏加载动画
         作用：在 JS bundle 下载和解析期间，用户看到的是这个动画而不是白屏。
         这是很实用的体验优化 —— 首屏白屏超过 1 秒用户就会觉得"卡"。 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        z-index: 9999;
      }
      #app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #app-loading .text {
        margin-top: 16px;
        color: #6b7280;
        font-size: 14px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="spinner"></div>
        <div class="text">正在加载系统…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
