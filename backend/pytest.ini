[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# 显式声明异步 fixture 的事件循环作用域，消除 pytest-asyncio 的弃用警告。
# 不声明的话未来版本行为会变化（从 session 改成 function），可能让测试突然失败。
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning